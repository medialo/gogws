name: docs

on:
  push:
    branches:
      - master
    paths:
      - "Writerside/**"
      - "schemas/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  INSTANCE: Writerside/gogws
  DOCKER_VERSION: 2026.09.0357
  ALGOLIA_INDEX_NAME: gogws
  CONFIG_JSON_PRODUCT: gogws
  CONFIG_JSON_VERSION: master

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.define-ids.outputs.artifact }}
      algolia_artifact: ${{ steps.define-ids.outputs.algolia_artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define instance id and artifacts
        id: define-ids
        run: |
          INSTANCE_ID="${INSTANCE#*/}"
          INSTANCE_ID_UPPER="${INSTANCE_ID^^}"
          echo "artifact=webHelp${INSTANCE_ID_UPPER}2-all.zip" >> "$GITHUB_OUTPUT"
          echo "algolia_artifact=algolia-indexes-${INSTANCE_ID_UPPER}.zip" >> "$GITHUB_OUTPUT"

      - name: Build docs
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.INSTANCE }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            artifacts/${{ steps.define-ids.outputs.artifact }}
            artifacts/report.json
            artifacts/${{ steps.define-ids.outputs.algolia_artifact }}
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: artifacts

      - name: Test documentation
        uses: JetBrains/writerside-checker-action@v1
        with:
          instance: ${{ env.INSTANCE }}

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs

      - name: Unzip site
        run: unzip -O UTF-8 -qq "${{ needs.build.outputs.artifact }}" -d site

      - name: Add schemas
        run: |
          if [ -d schemas ]; then
            mkdir -p site/schemas
            cp schemas/*.json site/schemas/
          fi

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

  publish-indexes:
    needs: [build, test, deploy]
    runs-on: ubuntu-latest
    container:
      image: registry.jetbrains.team/p/writerside/builder/algolia-publisher:latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: artifacts

      - name: Unzip Algolia indexes
        run: unzip -O UTF-8 -qq "artifacts/${{ needs.build.outputs.algolia_artifact }}" -d algolia-indexes

      - name: Update Algolia index
        env:
          ALGOLIA_APP_NAME: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_WRITE_API_KEY }}
        run: |
          env "algolia-key=${ALGOLIA_KEY}" java -jar /opt/builder/help-publication-agent.jar update-index \
            --application-name "${ALGOLIA_APP_NAME}" \
            --index-name "${ALGOLIA_INDEX_NAME}" \
            --product "${CONFIG_JSON_PRODUCT}" \
            --version "${CONFIG_JSON_VERSION}" \
            --index-directory algolia-indexes/
